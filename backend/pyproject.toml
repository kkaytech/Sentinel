[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.1.0"
description = "Pre-publication data quality gate for supplier invoice reporting"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "argon2-cffi>=23.1",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "import-linter>=2.0",
    "types-pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608"]
"migrations/**" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["sentinel"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["argon2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["db: needs a PostgreSQL server"]

[tool.coverage.run]
source = ["sentinel"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true

# Import contracts (NFR-008, ARD §6.2).
# Layer order follows ARD §6.2 as amended by CR-06 (approved 2026-11-15):
# `identity` sits above `audit` (login must write audit events), and the pure
# permission policy lives in `shared.authz` so `audit` needs no `identity` import.
[tool.importlinter]
root_package = "sentinel"

[[tool.importlinter.contracts]]
name = "Domain layers"
type = "layers"
layers = [
    "sentinel.api",
    "sentinel.publication",
    "sentinel.review",
    "sentinel.impact",
    "sentinel.validation",
    "sentinel.ingestion",
    "sentinel.config",
    "sentinel.identity",
    "sentinel.audit",
    "sentinel.shared",
]

[[tool.importlinter.contracts]]
name = "AI is advisory: decision modules never import ai_explanation (AI-003)"
type = "forbidden"
source_modules = [
    "sentinel.validation",
    "sentinel.impact",
    "sentinel.review",
    "sentinel.publication",
    "sentinel.ingestion",
    "sentinel.config",
    "sentinel.identity",
    "sentinel.audit",
    "sentinel.jobs",
    "sentinel.shared",
]
forbidden_modules = ["sentinel.ai_explanation"]

[[tool.importlinter.contracts]]
name = "ai_explanation has no route to decisions"
type = "forbidden"
source_modules = ["sentinel.ai_explanation"]
forbidden_modules = ["sentinel.review", "sentinel.publication", "sentinel.api"]

[[tool.importlinter.contracts]]
name = "jobs knows nothing about domain modules"
type = "forbidden"
source_modules = ["sentinel.jobs"]
forbidden_modules = [
    "sentinel.api",
    "sentinel.publication",
    "sentinel.review",
    "sentinel.impact",
    "sentinel.validation",
    "sentinel.ingestion",
    "sentinel.config",
    "sentinel.ai_explanation",
]
