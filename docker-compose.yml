# Local stack (ADR-015): db, one-shot migrate (owner credential), app (no owner credential).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      SENTINEL_OWNER_PASSWORD: ${SENTINEL_OWNER_PASSWORD:?set in .env}
      SENTINEL_APP_PASSWORD: ${SENTINEL_APP_PASSWORD:?set in .env}
      SENTINEL_READER_PASSWORD: ${SENTINEL_READER_PASSWORD:?set in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init/01-sentinel.sh:/docker-entrypoint-initdb.d/01-sentinel.sh:ro
      - ./db/init:/sentinel-init:ro
    healthcheck:
      # TCP, not the socket: during first-time init the temporary server listens on the socket
      # only, so this stays unhealthy until init (roles + database) has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      SENTINEL_OWNER_DATABASE_URL: postgresql+psycopg://sentinel_owner:${SENTINEL_OWNER_PASSWORD}@db:5432/sentinel
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    environment:
      SENTINEL_APP_DATABASE_URL: postgresql+psycopg://sentinel_app:${SENTINEL_APP_PASSWORD}@db:5432/sentinel
      SENTINEL_SESSION_SECRET: ${SENTINEL_SESSION_SECRET:?set in .env}
      SENTINEL_ENV: ${SENTINEL_ENV:-development}
      SENTINEL_AI_ENABLED: "false"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
